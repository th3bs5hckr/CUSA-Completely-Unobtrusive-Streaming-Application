plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace "com.buuyst07.cusa"
    compileSdk 34

    defaultConfig {
        applicationId "com.buuyst07.cusa"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'armeabi-v7a'
        }

        manifestPlaceholders = [
            'appAuthRedirectScheme': 'com.buuyst07.cusa'
        ]
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.15"
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation "androidx.compose.ui:ui:1.7.8"
    implementation "androidx.compose.material3:material3:1.2.1"
    implementation "androidx.compose.foundation:foundation:1.7.8"
    implementation "androidx.compose.runtime:runtime:1.7.8"
    implementation "androidx.activity:activity-compose:1.8.1"

    implementation "com.google.apis:google-api-services-youtube:v3-rev20240221-2.0.0"
    implementation "com.google.auth:google-auth-library-oauth2-http:1.11.1"
    implementation "com.google.android.gms:play-services-auth:21.0.0"
    
    implementation "com.squareup.okhttp3:okhttp:4.11.0"
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.google.code.gson:gson:2.10.1"

    implementation "com.arthenica:ffmpeg-kit-android:6.0-gpl"

    implementation "androidx.core:core:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.media:media:1.6.0"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"

    implementation "androidx.datastore:datastore-preferences:1.0.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2"
}
